[project]
name = "bubble-yolo"
version = "0.2.0"
description = "YOLO pre-labeling for rising / sitting bubbles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "ultralytics>=8.3.0",
    "cinereader>=1.4",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.scripts]
bubble-yolo = "bubble_yolo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bubble_yolo"]

[tool.hatch.build.targets.sdist]
include = ["src/bubble_yolo", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"
