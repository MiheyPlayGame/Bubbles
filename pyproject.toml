[project]
name = "bubble-dataset"
version = "0.1.0"
description = "Pre-label bubbles from Phantom CINE files for YOLO training"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
    "Pillow>=10.0",
    "cinereader>=1.4",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.scripts]
bubble-dataset = "bubble_dataset.cli:main"
cine-to-yolo = "bubble_dataset.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bubble_dataset"]

[tool.hatch.build.targets.sdist]
include = ["src/bubble_dataset", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"
